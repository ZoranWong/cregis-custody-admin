        detail:
          type: string
          description: 节点详情
        time:
          type: string
          description: 发生时间
        status:
          type: string
          description: 节点状态：completed-完成 / failed-失败 / info-信息 / active-进行中
    TravelRuleTabView:
      type: object
      description: Travel Rule Tab
      properties:
        orderId:
          type: string
          description: 订单ID
        notabeneTxId:
          type: string
          description: Notabene 交易ID（txn_xxx），无记录时为空
        status:
          type: string
          description: Travel Rule 内部状态：CREATED/PII_APPENDED/AUTHORIZED/ACCEPTED/REJECTED/SETTLED 等
        vaspIdentity:
          $ref: '#/components/schemas/VaspIdentityView'
          description: VASP 身份（双方 DID 与 Notabene 状态）
        fiatValuation:
          $ref: '#/components/schemas/FiatValuationView'
          description: 法币估值快照（判定时点落库值）；无 Travel Rule 记录或该笔未落快照时为空
        vaspDeclaration:
          $ref: '#/components/schemas/VaspDeclarationView'
          description: 对方 VASP「申报 vs 后端查到」比对（出金）。VASP 身份属 Travel Rule 域，故放本 Tab。申报不一致的单子没有 Travel Rule 交易记录，此对象仍会返回（申报值 + 查到值都来自别处）
        ivms101Valid:
          type: boolean
          description: IVMS101 是否通过校验。**每次请求实时调 Notabene /validate-pii 得出、不落库**；无载荷或接口失败时为 null
        ivms101MissingFields:
          type: array
          description: 实时校验返回的缺失字段（原样返回）；通过或未校验时为空
          items:
            type: string
        ivms101Pii:
          type: object
          additionalProperties: {}
          description: IVMS101 PII 原文（发起方/受益方身份信息，原样返回、不做加工）；无 TR 记录或载荷为空时为 null
        networkTrace:
          type: array
          description: 网络轨迹（Notabene Webhook 事件时间线）
          items:
            $ref: '#/components/schemas/TimelineNodeView'
        manualTrace:
          type: array
          description: 人工处理轨迹
          items:
            $ref: '#/components/schemas/TimelineNodeView'
        attestations:
          type: array
          description: 线下 Travel Rule 证据列表，按上传时间正序；无记录时为空数组
          items:
            $ref: '#/components/schemas/AttestationView'
        offlineTravelRule:
          type: boolean
          description: 是否 off-network（无 Notabene 交易）；前端据此决定是否展示上传入口
    VaspDeclarationView:
      type: object
      description: 对方 VASP「申报 vs 后端查到」比对（出金）。出金要求申报 did 与后端 discover 查到的一致才可放行；不一致（或未申报）时订单进入 VASP_MISMATCH_PENDING，由 admin 修正 VASP 或强制放行
      properties:
        declaredDid:
          type: string
          description: 用户申报的 DID（来自出金请求 travel_rule_payload 的**原始**填写，admin 修改不回写）
        declaredName:
          type: string
          description: 用户申报的 VASP 机构名（仅展示，不参与一致性判定）
        discoveredDid:
          type: string
          description: 后端 discover 查到的归属 DID；对手方为个人钱包等未建 TR 交易时为 null
        discoveredName:
          type: string
          description: 后端查到的 VASP 机构名（Notabene 目录）
        reviewStatus:
          type: string
          description: 复核状态 MATCHED/MISMATCH/CONFIRMED；未复核为 null
        reason:
          type: string
          description: VASP 验证异常类型：vasp-mismatch-申报与查到不一致 / no-vasp-pending-未查到对手方 VASP；后者只能强制放行，不支持修正 VASP
    VaspIdentityView:
      type: object
      description: VASP 身份
      properties:
        name:
          type: string
          description: 对手方 VASP 机构名（Notabene 目录，规则评估时落库）；未评估/目录无收录时为空。原 Jurisdiction / Regulatory Status / TR Capable / DID 四项已按要求移除
    MessageResultListAttestationView:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
