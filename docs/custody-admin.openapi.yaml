    ListRequest:
      type: object
      description: Travel Rule 通知列表请求（双向）
      properties:
        direction:
          type: string
          description: 方向：INBOUND-入金 / OUTBOUND-出金 / ALL-全部，空=全部
        status:
          type: string
          description: 状态过滤：接受归一化五态 waiting/approved/rejected/settled/failed（推荐），也兼容原始值 CREATED/PII_APPENDED/AUTHORIZED/ACCEPTED/REJECTED/SETTLING/SETTLED 等；未触发 Travel Rule 的 UNMATCHED/FAILED 记录始终不返回，传这两个值结果为空
        ecode:
          type: string
          description: 商户ecode，精确匹配
        dateFrom:
          type: string
          format: date-time
          description: 创建时间起（含），格式 yyyy-MM-dd HH:mm:ss
        dateTo:
          type: string
          format: date-time
          description: 创建时间止（含），格式 yyyy-MM-dd HH:mm:ss
        keyword:
          type: string
          description: 关键词，模糊匹配内部订单号/Notabene交易ID/付款地址/收款地址
        page:
          type: integer
          format: int32
          default: 1
          description: 页码，从1开始
        pageSize:
          type: integer
          format: int32
          default: 20
          description: 每页条数
