          type: string
          description: 方向：INBOUND-入金（我方为受益方EB）/ OUTBOUND-出金（我方为发起方EA）
        ecode:
          type: string
          description: 商户ecode（入金按收款地址、出金按付款地址归属解析；历史数据可能为空）
        enterpriseName:
          type: string
          description: 企业名称（按商户ecode解析）
        ivms101Payload:
          type: object
          additionalProperties: {}
          description: IVMS101 PII 明细（发起方/受益方身份信息）
        notabeneTxId:
          type: string
          description: Notabene交易ID（txn_xxx）；直入未匹配（UNMATCHED）时为空
        transferId:
          type: string
          description: 内部转账ID/订单ID：入金为入金订单号（预生成I开头），出金为出金订单号
        status:
          type: string
          description: 内部状态：CREATED/PII_APPENDED/UNMATCHED/AUTHORIZED/ACCEPTED/REJECTED/SETTLING/SETTLED/REVERTED
        state:
          type: string
          description: 归一化状态（原型五态）：waiting-等对方授权 / approved-对方已批准 / rejected-已拒绝 / settled-已结算 / failed-结算失败；UNMATCHED 为 na（未建立 Travel Rule）。未知状态为空
        directionLabel:
          type: string
          description: 方向展示值：incoming-入金 / outgoing-出金（direction 字段保留内部 INBOUND/OUTBOUND）
        notabeneStatus:
          type: string
          description: Notabene原始状态（Notabene返回的 transfer.status）
        originatorDid:
          type: string
          description: 发起方VASP DID
        beneficiaryDid:
          type: string
          description: 受益方VASP DID
        sourceAddress:
          type: string
          description: 付款地址（对方出金地址）
        settlementAddress:
          type: string
          description: 收款地址（我方入金地址）
        assetCode:
          type: string
          description: 币种代码，如 USDT/ETH
        assetAmount:
          type: string
          description: 金额（链上最小单位整数，字符串避免前端精度丢失）
        coinId:
          type: string
          description: 币种ID，通过关联订单解析（入金/出金分表查询）；订单未创建或未关联时为空
        network:
          type: string
          description: 所在网络，通过关联订单解析；订单未创建或未关联时为空
        currentFiatAmount:
          type: string
          description: 法币估值（实时），由 cus_travel_rule_coin.fiat_rate **实时换算**——注意这不是历史值，缺 coinId/汇率配置时为空
        currentFiatCurrency:
          type: string
          description: 实时估值的法币代码，如 AED；与 currentFiatAmount 成对返回
        fiatAmount:
          type: string
          description: 法币估值（落库快照）：Travel Rule 判定时点按 cus_travel_rule_coin.fiat_rate 换算并落库，供日后核对当时为什么走/没走 Travel Rule；迁移前的历史数据为空
        fiatCurrency:
          type: string
          description: 落库快照的法币代码，如 AED
        fiatRate:
          type: string
          description: 落库快照的判定时点汇率：1 coin = ? 法币
        fiatThreshold:
          type: string
          description: 落库快照的判定时点 Travel Rule 门槛(法币)
        originatorName:
          type: string
          description: 发起方名称：出金=我方商户名，入金=对方（从 IVMS101 提取，提取不到为空）
        beneficiaryName:
          type: string
          description: 受益方名称：入金=我方商户名，出金=对方（从 IVMS101 提取，提取不到为空）
        counterpartyVaspName:
          type: string
          description: 对手方 VASP 名称（Notabene 网络目录 GET /network/{did}）；由 TravelRuleCounterpartyVaspRecorder 在规则评估时落库，未走评估或 Notabene 未收录该 VASP 时为空
        counterpartyDid:
          type: string
          description: 对手方 VASP DID：入金取 originatorDid，出金取 beneficiaryDid
        createTime:
          type: string
          format: date-time
          description: 创建时间
        updateTime:
          type: string
          format: date-time
          description: 最近更新时间
        clientRef:
          type: string
          description: 客户端引用号（创建转账时的 ref，如 TR-XXXX）
        pdUrl:
          type: string
          description: Presentation Definition URL
        webhookEvents:
          type: object
          additionalProperties: {}
          description: 已收到的 Webhook 事件记录
