    EntityScreeningItem:
      type: object
      description: 主体筛查条目
      properties:
        subject:
          type: string
          description: 对象名称：vasp 取对手企业 VASP 机构名（Notabene 目录）；beneficiary 出金取**出金请求里填的受益人**（order.travel_rule_payload，本地数据、不查外部接口）、入金取 TR 记录里收到的发起方主体名。取不到为 null
        result:
          type: string
          description: 结论，直接作为徽章文案：CLEAR-未命中名单（GREEN）/ REVIEW-命中但非精确匹配、需人工判断（YELLOW，形如 "REVIEW (sanctions, crime)"，与 RED 的标签可能相同故保留前缀）/ <命中标签>（RED，如 sanctions，以 ", " 连接多个） / NA-无结论（未筛查、筛查进行中或失败）
    EntityScreeningView:
      type: object
      description: 主体筛查（Entity Screening）：固定两个具名对象（vasp / beneficiary），不用数组；取不到值时对象内字段为 null，结构不变
      properties:
        vasp:
          $ref: '#/components/schemas/EntityScreeningItem'
          description: 对手企业 VASP（Notabene 目录条目）
        beneficiary:
          $ref: '#/components/schemas/EntityScreeningItem'
          description: 受益人：对手方企业或个人（出金为下单时填的受益人、入金为收到的发起方主体）
    MessageResultComplianceTabView:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          $ref: '#/components/schemas/ComplianceTabView'
    OnchainScreeningItem:
      type: object
      description: 链上筛查条目。一笔交易一行，两个方向共用同一形态，不适用于该方向的字段为 null
      properties:
        txId:
          type: string
          description: 链上交易哈希：入金按整笔交易筛查，以此标识；出金无交易级筛查，为 null
        originatorAddresses:
          type: array
          description: 发起方地址：出金为我方出金地址，入金为对手方付款地址
          items:
            type: string
        beneficiaryAddresses:
          type: array
          description: 接收方地址：出金为对手方收款地址（可多条），入金为我方收款地址
          items:
            type: string
        txLevel:
          type: string
          description: 交易级风险等级：入金取 KYT（筛的是整笔交易）；出金无交易级筛查，为 null
        originatorLevel:
          type: string
          description: 发起方地址的风险等级：仅出金有值（地址级 KYA）；入金无地址级筛查，为 null
        beneficiaryLevel:
          type: string
          description: 接收方地址的风险等级：仅出金有值（地址级 KYA）；入金为 null
        result:
          type: string
          description: 本行筛查结论：CLEAR / HIT / UNKNOWN / NOT_REQUIRED。入金取交易级结论；出金取两侧更严重的一档（一高一低即 HIT，哪侧高风险看两个 *Level 字段）
    RuleTriggerView:
