          type: string
          description: 补充说明（预留）
    TransactionLensItemView:
      type: object
      description: 交易透镜列表项
      properties:
        orderId:
          type: string
          description: 订单ID
        direction:
          type: string
          description: 方向：outgoing-出金 / incoming-入金
        amount:
          type: string
          description: 金额（链上最小单位整数的字符串形式）
        coinId:
          type: string
          description: 币种ID，如 USDT/ETH
        network:
          type: string
          description: 网络，如 ETH/TRX
        fiatAmount:
          type: string
          description: 判定时点法币估值（落库快照，低于门槛被豁免的单子也有）；历史数据为空
        fiatCurrency:
          type: string
          description: 判定时点法币代码，如 AED；与 fiatAmount 成对返回
        fiatRate:
          type: string
          description: 判定时点汇率：1 coin = ? 法币
        fiatThreshold:
          type: string
          description: 判定时点生效的 Travel Rule 门槛(法币)，0=不豁免
        fiatBelowThreshold:
          type: boolean
          description: 是否低于门槛（true=豁免 Travel Rule）；历史数据为空
        createTime:
          type: string
          format: date-time
          description: 创建时间
        merchantName:
          type: string
          description: 商户名称
        originator:
          $ref: '#/components/schemas/PartyView'
          description: 发起方（出金=我方商户+付款地址；入金=对方付款地址）
        beneficiary:
          $ref: '#/components/schemas/PartyView'
          description: 受益方（出金=对方收款地址；入金=我方商户+收款地址）
        compliance:
          type: string
          description: 合规状态：clear / flagged / review / na（na=还没走到风控校验环节）
        travelRule:
          type: string
          description: Travel Rule 状态：complete / pending / mismatch / na
        signoff:
          type: string
          description: 审批状态：approved/ rejected / pending / na
        onchain:
          type: string
          description: 链上状态：broadcasted / confirming / confirmed（链上已确认、资金未入账；入金须链上确有交易）/ settled / failed / na（还没上链或不适用）
        disposition:
          type: string
          description: 资金处置状态（入金）：released / held（含被拒；入金须链上确有交易）/ na。forfeited 仅罚没接口落地后产生
